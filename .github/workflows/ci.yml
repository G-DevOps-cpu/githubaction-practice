name: Python CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main] 
    
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps: 
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with: 
          python-version: '3.12'

      - name: Run Application
        run: python app.py

      - name: Install Pytest
        run: pip install pytest

      - name: Run Automated Tests
        run: pytest -v

       